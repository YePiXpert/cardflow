# 移动端 CI（apps/mobile）。
#
# dart（ubuntu-latest）：push / pull_request 且移动端、规则协议、Python 引擎或本文件有变动时运行；
#   格式检查 → 静态分析 → 测试（App 与纯 Dart 领域包 packages/cardflow_domain 各自一套）
#   → Web 编译（只作编译烟雾测试，不发布）。
#   App 测试会运行 sqlite3 包的构建钩子（pubspec.yaml 的 hooks.user_defines 选 sqlite3mc），
#   钩子从 sqlite3.dart 的 GitHub release 下载预编译的 SQLite3MultipleCiphers 并校验 sha256；
#   加密库测试用的就是这份真实的库。领域包测试含禁止 double 的可执行扫描。
#
# protocol-parity（ubuntu-latest）：与 dart 同时触发；Python 引擎 1.1.0 与 Dart 领域层的双端一致性：
#   golden fixture（packages/rules-protocol/fixtures/*.v1.json）与 300 份带固定种子的随机 fixture
#   各由 Python 运行器与 Dart 运行器 --dump（cycles/verify 输出的规范化 JSON），两个目录 diff 必须为空；
#   再用 Python jsonschema（运行器的严格整数校验器 + format 检查）校验 Dart 的每个输出符合
#   PlanOutcome.schema.json 的 $defs/CardCycles 或 $defs/VerificationResult。任一步失败即红。
#
# ios-unsigned（macos-26）：只在手动触发（workflow_dispatch）或推送 ios-v* 标签时运行；
#   flutter build ios --release --no-codesign → 把 Runner.app 打成未签名 IPA → 检查（Bundle ID、最低系统、
#   隐私清单、App 图标、加密库 framework）→ 上传为 artifact → Required Reason API 扫描（BL-16，artifact
#   required-reason-scan）。
#   macOS runner 的分钟按 Linux 的 10 倍计。本仓库公开，目前不计费，但仍只在阶段交付或修复
#   iOS 原生配置时手动触发；日常验证走 dart job。
#
# 不存放任何签名材料：没有证书、描述文件、团队 ID，也没有签名相关的 secret。
# 签名由用户在安装前用自己的证书完成（见根 README"移动端"一节）。
#
# 供应链（BL-14）：4 个第三方 action 固定到 40 位提交 SHA，行尾注释是该提交对应的版本标签；SHA 由
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> 查得（带注释的 tag 再经 git/tags/<sha> 解引用到提交），
#   查询原文见 evidence/i1/I1-c/ci-pins.txt。升级时按同样方法查新标签的提交 SHA，同时改 SHA 与注释。

name: mobile

on:
  push:
    branches: [main]
    tags: ['ios-v*']
    paths:
      - 'apps/mobile/**'
      - 'packages/rules-protocol/**'
      - 'services/api/cardflow/planner/engine/**'
      - 'services/api/pyproject.toml'
      - 'services/api/uv.lock'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/rules-protocol/**'
      - 'services/api/cardflow/planner/engine/**'
      - 'services/api/pyproject.toml'
      - 'services/api/uv.lock'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 上同一种触发的新运行会取消旧运行；手动触发的 iOS 构建不会被随后的 push 取消。
concurrency:
  group: mobile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  UV_VERSION: '0.12.23'
  DOMAIN_DIR: apps/mobile/packages/cardflow_domain
  BUNDLE_ID: 'li.yep.cardflow'
  MIN_IOS: '15.0'

defaults:
  run:
    shell: bash
    working-directory: apps/mobile

jobs:
  dart:
    name: dart (format · analyze · test · web build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter --version
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: dart pub get (cardflow_domain)
        working-directory: ${{ env.DOMAIN_DIR }}
        run: dart pub get --enforce-lockfile

      - name: dart format
        run: dart format --output=none --set-exit-if-changed .

      - name: dart format (cardflow_domain)
        working-directory: ${{ env.DOMAIN_DIR }}
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze --fatal-infos

      - name: dart analyze (cardflow_domain)
        working-directory: ${{ env.DOMAIN_DIR }}
        run: dart analyze --fatal-infos

      - name: flutter test
        run: flutter test

      - name: dart test (cardflow_domain, incl. the no-double scan)
        working-directory: ${{ env.DOMAIN_DIR }}
        run: dart test --reporter expanded

      - name: flutter build web (compile smoke test)
        run: flutter build web --release

  protocol-parity:
    name: protocol-parity (Python engine vs Dart domain)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    env:
      # 期望的产出文件数（BL-14：写死，少了或多了都失败；加 fixture、case 或改随机样本数时同步改这里）。
      # golden：packages/rules-protocol/fixtures/ 下唯一的 regression_2026-10-16_10000.v1.json，expected 里
      #   cycles 1 个 + verify 2 个 = 3（另 3 个 plan case 需要 CP-SAT，两端运行器都不写出）。
      EXPECTED_GOLDEN_OUTPUTS: '3'
      # 随机：tool/gen_parity_fixtures.dart --count 300，每份 fixture 1 个 cycles + 3 个 verify = 1200。
      EXPECTED_RANDOM_OUTPUTS: '1200'
      # Schema 校验的 Dart 输出：cycles 1 + 300 = 301，verify 2 + 900 = 902（上面两组之和）。
      EXPECTED_SCHEMA_CYCLES: '301'
      EXPECTED_SCHEMA_VERIFY: '902'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.13'
          cache-dependency-glob: services/api/uv.lock

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: uv sync --locked (services/api)
        run: uv sync --locked --project services/api

      - name: dart pub get (cardflow_domain)
        working-directory: ${{ env.DOMAIN_DIR }}
        run: dart pub get --enforce-lockfile

      - name: Golden fixtures -- Python runner --dump
        run: |
          uv run --project services/api python packages/rules-protocol/runner_py/run_fixtures.py \
            --dump build/parity/golden/python

      - name: Golden fixtures -- Dart runner --dump
        working-directory: ${{ env.DOMAIN_DIR }}
        run: dart run cardflow_domain:run_fixtures --dump "$GITHUB_WORKSPACE/build/parity/golden/dart"

      - name: Golden fixtures -- outputs byte-identical
        run: |
          set -euo pipefail
          n="$(find build/parity/golden/python -name '*.json' | wc -l)"
          test "$n" -eq "$EXPECTED_GOLDEN_OUTPUTS" || { echo "::error::expected $EXPECTED_GOLDEN_OUTPUTS golden outputs from the Python runner, found $n"; exit 1; }
          m="$(find build/parity/golden/dart -name '*.json' | wc -l)"
          test "$m" -eq "$EXPECTED_GOLDEN_OUTPUTS" || { echo "::error::expected $EXPECTED_GOLDEN_OUTPUTS golden outputs from the Dart runner, found $m"; exit 1; }
          diff -r build/parity/golden/python build/parity/golden/dart
          echo "golden fixtures: $n cycles/verify outputs byte-identical (expected $EXPECTED_GOLDEN_OUTPUTS)"
          (cd build/parity/golden/dart && find . -name '*.json' -exec sha256sum {} + | sort -k 2)

      - name: Random fixtures (300, seed 20261018) -- generate
        working-directory: ${{ env.DOMAIN_DIR }}
        run: |
          dart run tool/gen_parity_fixtures.dart "$GITHUB_WORKSPACE/build/parity/random/fixtures" \
            --count 300 --seed 20261018

      - name: Random fixtures -- both runners --dump, outputs byte-identical
        run: |
          set -euo pipefail
          uv run --project services/api python packages/rules-protocol/runner_py/run_fixtures.py \
            --dump build/parity/random/python build/parity/random/fixtures > build/parity/random/python.log
          tail -n 1 build/parity/random/python.log
          (cd "$DOMAIN_DIR" && dart run cardflow_domain:run_fixtures \
            --dump "$GITHUB_WORKSPACE/build/parity/random/dart" \
            "$GITHUB_WORKSPACE/build/parity/random/fixtures" > "$GITHUB_WORKSPACE/build/parity/random/dart.log")
          tail -n 1 build/parity/random/dart.log
          n="$(find build/parity/random/python -name '*.json' | wc -l)"
          test "$n" -eq "$EXPECTED_RANDOM_OUTPUTS" || { echo "::error::expected $EXPECTED_RANDOM_OUTPUTS dumped outputs, found $n"; exit 1; }
          diff -r build/parity/random/python build/parity/random/dart
          echo "random fixtures: $n cycles/verify outputs byte-identical (expected $EXPECTED_RANDOM_OUTPUTS)"

      - name: Dart outputs conform to PlanOutcome.schema.json $defs (Python jsonschema)
        run: |
          uv run --project services/api python - build/parity <<'EOF'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "packages/rules-protocol/runner_py")
          import run_fixtures as runner  # strict integers + date-time format checker
          from cardflow.planner.engine.protocol import parse_json

          refs = {
              "cycles": "PlanOutcome.schema.json#/$defs/CardCycles",
              "verify": "PlanOutcome.schema.json#/$defs/VerificationResult",
          }
          registry = runner.load_registry()
          files = sorted(Path(sys.argv[1]).glob("*/dart/*/*.json"))
          checked = {kind: 0 for kind in refs}
          failed = 0
          for path in files:
              kind = path.name.rsplit(".", 2)[-2]
              output = parse_json(path.read_bytes())
              errors = runner.schema_errors(registry, refs[kind], output)
              errors += [f"JSON float at {p}" for p in runner.find_floats(output)]
              checked[kind] += 1
              if errors:
                  failed += 1
                  print(f"::error::{path}: " + "; ".join(errors[:5]))
          print(f"validated {len(files)} Dart outputs: {checked}; {failed} invalid")
          expected = {
              "cycles": int(os.environ["EXPECTED_SCHEMA_CYCLES"]),
              "verify": int(os.environ["EXPECTED_SCHEMA_VERIFY"]),
          }
          if checked != expected:
              print(f"::error::expected {expected} Dart outputs, validated {checked}")
          sys.exit(1 if failed or checked != expected else 0)
          EOF

      - name: Upload parity outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protocol-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/parity/
          retention-days: 14
          if-no-files-found: warn

  ios-unsigned:
    name: ios-unsigned (IPA without codesign)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-v')
    needs: dart
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          mkdir -p build-logs
          {
            flutter --version
            xcodebuild -version
            sw_vers
          } 2>&1 | tee build-logs/toolchain.txt
          flutter doctor -v > build-logs/flutter-doctor.txt 2>&1 || true

      - name: flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Lint iOS property lists
        run: plutil -lint ios/Runner/Info.plist ios/Runner/PrivacyInfo.xcprivacy ios/Runner.xcodeproj/project.pbxproj

      - name: flutter build ios --release --no-codesign
        run: |
          set -o pipefail
          if ! flutter build ios --release --no-codesign \
              --build-number="${{ github.run_number }}" \
              --dart-define=CARDFLOW_GIT_SHA="${GITHUB_SHA}" \
              -v > build-logs/flutter-build-ios.log 2>&1; then
            echo "::error::flutter build ios failed; last 200 lines below, full log in the ios-build-logs artifact"
            tail -n 200 build-logs/flutter-build-ios.log
            exit 1
          fi
          tail -n 40 build-logs/flutter-build-ios.log

      - name: Package unsigned IPA
        id: ipa
        run: |
          set -euo pipefail
          base="cardflow-unsigned-${GITHUB_SHA:0:7}"
          name="$base.ipa"
          rm -rf Payload "$name"
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$name" Payload
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Verify IPA
        run: |
          set -euo pipefail
          name="${{ steps.ipa.outputs.name }}"
          plist=Payload/Runner.app/Info.plist
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          bundle_id="$(read_key CFBundleIdentifier)"
          min_os="$(read_key MinimumOSVersion)"
          version="$(read_key CFBundleShortVersionString)"
          build="$(read_key CFBundleVersion)"
          display_name="$(read_key CFBundleDisplayName)"
          echo "CFBundleIdentifier=$bundle_id MinimumOSVersion=$min_os version=$version build=$build"
          test "$bundle_id" = "$BUNDLE_ID" || { echo "::error::CFBundleIdentifier is $bundle_id, expected $BUNDLE_ID"; exit 1; }
          test "$min_os" = "$MIN_IOS" || { echo "::error::MinimumOSVersion is $min_os, expected $MIN_IOS"; exit 1; }
          test ! -e Payload/Runner.app/embedded.mobileprovision || { echo "::error::unexpected embedded.mobileprovision"; exit 1; }
          test -f Payload/Runner.app/PrivacyInfo.xcprivacy || { echo "::error::PrivacyInfo.xcprivacy missing from Runner.app"; exit 1; }
          test -d Payload/Runner.app/Frameworks/Flutter.framework
          test -d Payload/Runner.app/Frameworks/App.framework
          ls Payload/Runner.app/Frameworks
          # App 图标（公测版 0.1.0）：actool 编译出 Assets.car，并在 Info.plist 写入 CFBundleIcons（主图标名 AppIcon）。
          icon_name="$(read_key CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName 2>/dev/null || true)"
          test "$icon_name" = "AppIcon" || { echo "::error::CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName is '$icon_name', expected AppIcon"; exit 1; }
          test -f Payload/Runner.app/Assets.car || { echo "::error::Runner.app/Assets.car missing (the app icon was not compiled)"; exit 1; }
          assets_size="$(stat -f %z Payload/Runner.app/Assets.car)"
          echo "CFBundleIcons primary icon: $icon_name; Assets.car: $assets_size bytes"
          # 加密本地库（I-0b）：sqlite3 构建钩子打进包里的必须是 SQLite3MultipleCiphers。
          cipher_fw=""
          for fw in Payload/Runner.app/Frameworks/*.framework; do
            case "$(basename "$fw")" in App.framework|Flutter.framework) continue ;; esac
            bin="$fw/$(basename "$fw" .framework)"
            if [ -f "$bin" ] && grep -aq "SQLite3 Multiple Ciphers" "$bin"; then
              cipher_fw="$(basename "$fw")"
            fi
          done
          test -n "$cipher_fw" || { echo "::error::no framework in Runner.app contains SQLite3 Multiple Ciphers (check hooks.user_defines in pubspec.yaml)"; exit 1; }
          echo "SQLite3MultipleCiphers framework: $cipher_fw"
          unzip -l "$name" | tail -n 1
          size="$(stat -f %z "$name")"
          sha256="$(shasum -a 256 "$name" | cut -d ' ' -f 1)"
          echo "IPA $name size=$size sha256=$sha256"
          {
            echo "### Unsigned IPA"
            echo ""
            echo "| key | value |"
            echo "|---|---|"
            echo "| file | \`$name\` |"
            echo "| size (bytes) | $size |"
            echo "| sha256 | \`$sha256\` |"
            echo "| CFBundleIdentifier | $bundle_id |"
            echo "| CFBundleDisplayName | $display_name |"
            echo "| CFBundleShortVersionString | $version |"
            echo "| CFBundleVersion | $build |"
            echo "| MinimumOSVersion | $min_os |"
            echo "| CFBundleIcons primary icon | $icon_name |"
            echo "| Assets.car (bytes) | $assets_size |"
            echo "| SQLite3MultipleCiphers | \`$cipher_fw\` |"
            echo "| source | ${GITHUB_SHA} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.ipa.outputs.base }}
          path: apps/mobile/${{ steps.ipa.outputs.name }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      # BL-16：Required Reason API 扫描。Apple 要求在隐私清单里登记理由的四类 API（UserDefaults、FileTimestamp、
      # SystemBootTime、DiskSpace）：对 Runner.app 的主二进制与 Frameworks/ 下每个二进制，nm -u 查导入的符号，
      # strings 查 ObjC 选择器、常量名与 sysctl 名（C 函数名只看 nm -u，避免"stat"一类子串误报）；同时查每个
      # framework 是否自带 PrivacyInfo.xcprivacy。规则：主二进制或没有自带清单的 framework 命中的类别留在
      # ios/Runner/PrivacyInfo.xcprivacy，其余删除（理由码不变）；结论见 evidence/i1/I1-c/required-reason-scan.txt。
      # 命中是正常结果，只报告不判失败；工具出错才失败。
      - name: Required Reason API scan (BL-16)
        run: |
          set -euo pipefail
          export LC_ALL=C  # 二进制里的字符串不一定是合法 UTF-8：grep/sort 按字节处理
          app=Payload/Runner.app
          out=build-logs/required-reason-scan
          rm -rf "$out"
          mkdir -p "$out/nm-u" "$out/strings"
          hits="$out/hits.tsv"
          : > "$hits"
          categories="UserDefaults FileTimestamp SystemBootTime DiskSpace"
          nm_regex() {
            case "$1" in
              UserDefaults) echo '^_OBJC_CLASS_\$_NSUserDefaults$' ;;
              FileTimestamp) echo '^_(stat|fstat|lstat|getattrlist|fgetattrlist|getattrlistbulk)(64)?(\$INODE64)?$|^_(NSFileCreationDate|NSFileModificationDate|NSURLContentModificationDateKey|NSURLCreationDateKey)$' ;;
              SystemBootTime) echo '^_(mach_absolute_time|sysctl|sysctlbyname)$' ;;
              DiskSpace) echo '^_(statfs|statvfs|fstatfs|fstatvfs)(64)?(\$INODE64)?$|^_(NSFileSystemFreeSize|NSFileSystemSize|NSURLVolumeAvailableCapacityKey|NSURLVolumeAvailableCapacityForImportantUsageKey|NSURLVolumeAvailableCapacityForOpportunisticUsageKey|NSURLVolumeTotalCapacityKey)$' ;;
            esac
          }
          strings_regex() {
            case "$1" in
              UserDefaults) echo 'NSUserDefaults' ;;
              FileTimestamp) echo 'NSFileCreationDate|NSFileModificationDate|NSURLContentModificationDateKey|NSURLCreationDateKey|getattrlist' ;;
              SystemBootTime) echo 'systemUptime|kern\.boottime|mach_absolute_time' ;;
              DiskSpace) echo 'NSFileSystemFreeSize|NSFileSystemSize|[vV]olumeAvailableCapacity[A-Za-z]*|[vV]olumeTotalCapacityKey|statv?fs' ;;
            esac
          }
          all_strings_regex="$(for c in $categories; do printf '%s|' "$(strings_regex "$c")"; done | sed 's/|$//')"
          # scan <文件名键> <显示名> <二进制> <自带清单：main/yes/no>
          scan() {
            local key="$1" label="$2" bin="$3" manifest="$4" c nm_hits str_hits
            nm -u "$bin" | awk 'NF {print $NF}' | sort -u > "$out/nm-u/$key.txt"
            if command -v strings > /dev/null; then
              strings -a "$bin" > "$out/strings/$key.all"
            else
              grep -aoE '[[:print:]]{4,}' "$bin" > "$out/strings/$key.all" || true
            fi
            grep -E "$all_strings_regex" "$out/strings/$key.all" > "$out/strings/$key.txt" || true
            echo "== $label（$(stat -f %z "$bin") 字节；自带 PrivacyInfo.xcprivacy：$manifest）"
            for c in $categories; do
              nm_hits="$(grep -E "$(nm_regex "$c")" "$out/nm-u/$key.txt" | tr '\n' ' ' || true)"
              str_hits="$(grep -oE "$(strings_regex "$c")" "$out/strings/$key.all" | sort | uniq -c | awk '{printf "%s(%d) ", $2, $1}' || true)"
              echo "  $c：nm -u ${nm_hits:-无}；strings ${str_hits:-无}"
              if [ -n "$nm_hits$str_hits" ]; then
                printf '%s\t%s\t%s\n' "$label" "$manifest" "$c" >> "$hits"
              fi
            done
            rm -f "$out/strings/$key.all"
          }
          {
            echo "# Required Reason API 扫描（BL-16）：$(date -u +%Y-%m-%dT%H:%M:%SZ)，源码 ${GITHUB_SHA}，运行 ${GITHUB_RUN_ID}"
            echo "# 工具：nm = $(command -v nm)，strings = $(command -v strings || echo '无，改用 grep -ao')；$(xcodebuild -version | tr '\n' ' ')"
            exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
            scan "main-$exe" "Runner.app/$exe（主二进制）" "$app/$exe" main
            for fw in "$app"/Frameworks/*.framework; do
              name="$(basename "$fw" .framework)"
              fexe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$fw/Info.plist" 2>/dev/null || echo "$name")"
              if [ -f "$fw/PrivacyInfo.xcprivacy" ]; then own=yes; else own=no; fi
              scan "framework-$name" "Frameworks/$name.framework/$fexe" "$fw/$fexe" "$own"
            done
            for dylib in "$app"/Frameworks/*.dylib; do
              [ -f "$dylib" ] || continue
              scan "dylib-$(basename "$dylib")" "Frameworks/$(basename "$dylib")" "$dylib" no
            done
            echo "== Runner.app 内的全部隐私清单"
            (cd "$app" && find . -name PrivacyInfo.xcprivacy | sort) | while read -r manifest; do
              echo "-- $manifest"
              plutil -p "$app/$manifest"
            done
            echo "== 结论：主二进制或没有自带清单的 framework 命中的类别留在 ios/Runner/PrivacyInfo.xcprivacy，其余删除（理由码不变）"
            for c in $categories; do
              need="$(awk -F '\t' -v c="$c" '$3 == c && ($2 == "main" || $2 == "no") {printf "%s ", $1}' "$hits")"
              covered="$(awk -F '\t' -v c="$c" '$3 == c && $2 == "yes" {printf "%s ", $1}' "$hits")"
              if grep -q "NSPrivacyAccessedAPICategory$c<" ios/Runner/PrivacyInfo.xcprivacy; then declared=已登记; else declared=未登记; fi
              if [ -n "$need" ]; then verdict=保留; else verdict=删除; fi
              echo "  $c：App 清单$declared；须由 App 清单承担的命中：${need:-无}；自带清单的 framework 命中：${covered:-无} → $verdict"
            done
          } | tee "$out/required-reason-scan.txt"
          {
            echo "### Required Reason API scan (BL-16)"
            echo ""
            echo '```'
            sed -n '/^== 结论/,$p' "$out/required-reason-scan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Required Reason API scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: required-reason-scan
          path: apps/mobile/build-logs/required-reason-scan/
          retention-days: 14
          if-no-files-found: error

      - name: Collect Xcode logs
        if: failure()
        run: |
          mkdir -p build-logs/DerivedData
          for dir in "$HOME"/Library/Developer/Xcode/DerivedData/*/Logs; do
            [ -d "$dir" ] || continue
            dest="build-logs/DerivedData/$(basename "$(dirname "$dir")")"
            mkdir -p "$dest"
            cp -R "$dir" "$dest/"
          done
          ls -R build-logs | head -n 100

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/mobile/build-logs/
          retention-days: 14
          if-no-files-found: warn
