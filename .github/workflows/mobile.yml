# 移动端 CI（apps/mobile）。
#
# dart（ubuntu-latest）：push / pull_request 且移动端或本文件有变动时运行；
#   格式检查 → 静态分析 → 测试 → Web 编译（只作编译烟雾测试，不发布）。
#
# ios-unsigned（macos-26）：只在手动触发（workflow_dispatch）或推送 ios-v* 标签时运行；
#   flutter build ios --release --no-codesign → 把 Runner.app 打成未签名 IPA → 上传为 artifact。
#   macOS runner 的分钟按 Linux 的 10 倍计。本仓库公开，目前不计费，但仍只在阶段交付或修复
#   iOS 原生配置时手动触发；日常验证走 dart job。
#
# 不存放任何签名材料：没有证书、描述文件、团队 ID，也没有签名相关的 secret。
# 签名由用户在安装前用自己的证书完成（见根 README"移动端"一节）。

name: mobile

on:
  push:
    branches: [main]
    tags: ['ios-v*']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 上同一种触发的新运行会取消旧运行；手动触发的 iOS 构建不会被随后的 push 取消。
concurrency:
  group: mobile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  BUNDLE_ID: 'li.yep.cardflow'
  MIN_IOS: '15.0'

defaults:
  run:
    shell: bash
    working-directory: apps/mobile

jobs:
  dart:
    name: dart (format · analyze · test · web build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter --version
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: dart format
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze --fatal-infos

      - name: flutter test
        run: flutter test

      - name: flutter build web (compile smoke test)
        run: flutter build web --release

  ios-unsigned:
    name: ios-unsigned (IPA without codesign)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-v')
    needs: dart
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          mkdir -p build-logs
          {
            flutter --version
            xcodebuild -version
            sw_vers
          } 2>&1 | tee build-logs/toolchain.txt
          flutter doctor -v > build-logs/flutter-doctor.txt 2>&1 || true

      - name: flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Lint iOS property lists
        run: plutil -lint ios/Runner/Info.plist ios/Runner/PrivacyInfo.xcprivacy ios/Runner.xcodeproj/project.pbxproj

      - name: flutter build ios --release --no-codesign
        run: |
          set -o pipefail
          if ! flutter build ios --release --no-codesign \
              --build-number="${{ github.run_number }}" \
              --dart-define=CARDFLOW_GIT_SHA="${GITHUB_SHA}" \
              -v > build-logs/flutter-build-ios.log 2>&1; then
            echo "::error::flutter build ios failed; last 200 lines below, full log in the ios-build-logs artifact"
            tail -n 200 build-logs/flutter-build-ios.log
            exit 1
          fi
          tail -n 40 build-logs/flutter-build-ios.log

      - name: Package unsigned IPA
        id: ipa
        run: |
          set -euo pipefail
          base="cardflow-unsigned-${GITHUB_SHA:0:7}"
          name="$base.ipa"
          rm -rf Payload "$name"
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$name" Payload
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Verify IPA
        run: |
          set -euo pipefail
          name="${{ steps.ipa.outputs.name }}"
          plist=Payload/Runner.app/Info.plist
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          bundle_id="$(read_key CFBundleIdentifier)"
          min_os="$(read_key MinimumOSVersion)"
          version="$(read_key CFBundleShortVersionString)"
          build="$(read_key CFBundleVersion)"
          display_name="$(read_key CFBundleDisplayName)"
          echo "CFBundleIdentifier=$bundle_id MinimumOSVersion=$min_os version=$version build=$build"
          test "$bundle_id" = "$BUNDLE_ID" || { echo "::error::CFBundleIdentifier is $bundle_id, expected $BUNDLE_ID"; exit 1; }
          test "$min_os" = "$MIN_IOS" || { echo "::error::MinimumOSVersion is $min_os, expected $MIN_IOS"; exit 1; }
          test ! -e Payload/Runner.app/embedded.mobileprovision || { echo "::error::unexpected embedded.mobileprovision"; exit 1; }
          test -f Payload/Runner.app/PrivacyInfo.xcprivacy || { echo "::error::PrivacyInfo.xcprivacy missing from Runner.app"; exit 1; }
          test -d Payload/Runner.app/Frameworks/Flutter.framework
          test -d Payload/Runner.app/Frameworks/App.framework
          unzip -l "$name" | tail -n 1
          size="$(stat -f %z "$name")"
          sha256="$(shasum -a 256 "$name" | cut -d ' ' -f 1)"
          echo "IPA $name size=$size sha256=$sha256"
          {
            echo "### Unsigned IPA"
            echo ""
            echo "| key | value |"
            echo "|---|---|"
            echo "| file | \`$name\` |"
            echo "| size (bytes) | $size |"
            echo "| sha256 | \`$sha256\` |"
            echo "| CFBundleIdentifier | $bundle_id |"
            echo "| CFBundleDisplayName | $display_name |"
            echo "| CFBundleShortVersionString | $version |"
            echo "| CFBundleVersion | $build |"
            echo "| MinimumOSVersion | $min_os |"
            echo "| source | ${GITHUB_SHA} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ipa.outputs.base }}
          path: apps/mobile/${{ steps.ipa.outputs.name }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Collect Xcode logs
        if: failure()
        run: |
          mkdir -p build-logs/DerivedData
          for dir in "$HOME"/Library/Developer/Xcode/DerivedData/*/Logs; do
            [ -d "$dir" ] || continue
            dest="build-logs/DerivedData/$(basename "$(dirname "$dir")")"
            mkdir -p "$dest"
            cp -R "$dir" "$dest/"
          done
          ls -R build-logs | head -n 100

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/mobile/build-logs/
          retention-days: 14
          if-no-files-found: warn
