# 卡序 CardFlow 移动端静态分析配置。
# CI（.github/workflows/mobile.yml）与本机都以 `flutter analyze --fatal-infos` 运行，要求零输出。

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - ios/**
    - web/**
    # 纯 Dart 领域包有自己的 pubspec 与分析配置，在其目录下用 `dart analyze --fatal-infos` 检查。
    - packages/**

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    only_throw_errors: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unawaited_futures: true
    unnecessary_lambdas: true

# ---------------------------------------------------------------------------
# 约定：领域层禁止 double（ADR-008；architecture §3）
#
# 纯 Dart 领域层是独立包 packages/cardflow_domain（无 Flutter、无 drift 依赖），以 path 依赖引入：
#   - 金额一律用 int 最小单位 + 币种，小数位来自领域包的 minorDigits 表（MoneyText 也引用它）；
#   - 利率、系数用领域包的 Rational（BigInt 分数），取整模式显式传入（RoundingMode）；
#   - 禁止出现 double 类型、num 类型、小数/指数字面量、toDouble() 等调用与浮点除法 `/`。
# 可执行检查：packages/cardflow_domain/test/no_double_test.dart（CI 的 dart job 运行）。
# 展示层（lib/app、lib/features）只在布局尺寸、动画等非金额场景使用 double。
# ---------------------------------------------------------------------------
