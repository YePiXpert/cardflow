name: cardflow
description: "卡序 CardFlow：多信用卡管理 App（iOS 优先，纯本地可用）。"
publish_to: 'none'

# CFBundleShortVersionString = 版本名；CFBundleVersion = 构建号（CI 用 --build-number 覆盖）。
version: 0.0.1+1

environment:
  sdk: ^3.13.5

# 版本写死到补丁号，取自 docs/20-architecture/architecture.md §11。
# build_runner 与 flutter_lints 不在 §11 表内，由 I-0a 简报点名引入，版本见 README"移动端"一节。
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  go_router: 18.1.0
  intl: 0.20.3
  package_info_plus: 10.2.2
  # 加密本地库（ADR-001，PoC-1）：drift + sqlite3（构建钩子选 SQLite3MultipleCiphers，见文末 hooks）。
  drift: 2.35.2
  drift_flutter: 0.3.1
  sqlite3: 3.7.1
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
  # 纯 Dart 领域层（I-0c）：金额与最小单位表、账期、现金时间线、验证器、有限搜索、规则协议 v1。
  cardflow_domain:
    path: packages/cardflow_domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.2
  riverpod_generator: 4.0.9

flutter:
  uses-material-design: true

# sqlite3 包的构建钩子选项：把 SQLite3MultipleCiphers（sqlite3mc）而不是普通 SQLite 打进 App。
# 写法出处：drift 文档 Encryption 页（https://drift.simonbinder.eu/platforms/encryption/）与
# sqlite3 3.7.1 的 doc/hook.md（README 的 "hook options page"）；摘录见 evidence/i0/I0-b/hook-source.txt。
# 钩子下载 sqlite3.dart GitHub release 中预编译的 sqlite3mc，并用包内记录的 sha256 校验。
# 打开数据库前检查 PRAGMA cipher 与 sqlite3mc_version() 均非空，否则拒绝打开，不会退回明文库
# （lib/data/db/encryption.dart；PRAGMA cipher_version 是 SQLCipher 的 PRAGMA，sqlite3mc 对它返回空）。
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
