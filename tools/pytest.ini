# Tests for the scripts in tools/ (T-014). Run from the repository root with the server's
# environment (the end-to-end test imports the cardflow package):
#   uv run --project services/api pytest tools/tests
[pytest]
testpaths = tests
pythonpath = .
addopts = --import-mode=importlib --strict-markers --strict-config -ra -p no:cacheprovider
xfail_strict = true
