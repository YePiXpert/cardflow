# CardFlow development database (T-002). Manage it with tools/dev-db.sh, which always
# passes `-p cardflow-dev`; do not reuse this file for production (see T-012 compose.yaml).
# Isolation: own project/network/volume, published on 127.0.0.1 only, never the host's
# PostgreSQL on 5432. The password comes from deploy/secrets.dev/db_password (git-ignored,
# generated with mode 0600 by `tools/dev-db.sh up`).
name: cardflow-dev

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: cardflow
      POSTGRES_USER: cardflow
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "127.0.0.1:18432:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardflow -d cardflow"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g

secrets:
  db_password:
    file: ./secrets.dev/db_password

volumes:
  pgdata: {}
