# Alembic configuration for the CardFlow server (T-005).
#
# The database URL is NOT stored here. alembic/env.py resolves it in this order:
#   1. a connection passed programmatically (config.attributes["connection"]);
#   2. `-x url=postgresql+psycopg://...` on the alembic command line (tests/tools);
#   3. config.attributes["database_url"] (set by `cardflow migrate` / cardflow.db.migrations);
#   4. cardflow.settings: DATABASE_URL + DATABASE_PASSWORD(_FILE).
#
# Preferred entry point: `uv run cardflow migrate [--lock] [--check]`.
# Plain Alembic also works from services/api, e.g. `uv run alembic -x url=... upgrade head`.
# Revisions are written by hand (explicit DDL); do not use --autogenerate to create them.

[alembic]
script_location = %(here)s/alembic
# No prepend_sys_path: cardflow is an installed package; never import from the CWD.
path_separator = os
# Revision files are named <rev>_<slug>.py, e.g. 0001_initial.py.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
